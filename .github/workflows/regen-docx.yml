name: Regenerér Word-master fra plan.json

# Lukker to huller (fundet 16/7-2026):
#  1. plan.json pushet direkte (PAT/menneske) -> docx blev aldrig regenereret
#  2. det tidligere sync-onedrive.yml's push-trigger fyrede ikke paa
#     GITHUB_TOKEN-commits (workflowet er slettet 7/9-2026, blok 7)
# Derfor: generér -> commit -> sync til OneDrive INLINE. Ingen trigger-kaede.

on:
  push:
    paths:
      - 'data/plan.json'
      - 'scripts/modules/word_master.py'
      - 'scripts/modules/xlsx_master.py'
  schedule:
    # Soendag 18:00 UTC = 20:00 CET — efter soendags-check-in
    - cron: '0 18 * * 0'
    # Dagligt 04:00 UTC: Excel-arkets Tracking- og Ugesum-faner haenger paa
    # data.json, som regen-docx ikke trigger paa. Uden det her staar de stille
    # mellem plan-aendringer.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regen-docx
  cancel-in-progress: false

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests python-docx openpyxl

      - name: Generér masters (Kennet = Excel, Eva = Word)
        run: |
          python - <<'PY'
          import json, sys, pathlib
          sys.path.insert(0, "scripts")
          from modules import word_master, xlsx_master

          plan = json.load(open("data/plan.json"))
          try:
              dash = json.load(open("data.json"))
          except Exception as e:
              print("data.json kunne ikke laeses (tracking bliver tom):", e)
              dash = {}

          # Eva beholder sin Word-plan
          for path, blob in word_master.generate_both(plan).items():
              if "Eva" not in path:
                  continue
              pathlib.Path(path).write_bytes(blob)
              print("genereret", path, len(blob), "bytes")

          # Kennet: Excel erstatter Word (besluttet 6/8-2026)
          out = "data/Fast_as_Fifty_Masterplan_2026.xlsx"
          blob = xlsx_master.generate(plan, dash)
          pathlib.Path(out).write_bytes(blob)
          print("genereret", out, len(blob), "bytes")
          PY

      - name: Commit hvis ændret
        id: c
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.docx data/*.xlsx
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Ingen ændring — masters var allerede i synk"
          else
            git commit -m "masters: regenereret fra plan.json"
            # Retry: andre workflows (health, dashboard, webhook) committer paa main
            # samtidig; uden retry taber pushen kapløbet og hele runnet fejler.
            pushed=false
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash || true
              if git push; then pushed=true; break; fi
              echo "push-forsøg $i fejlede — prøver igen om $((i*5))s"
              sleep $((i*5))
            done
            if [ "$pushed" != "true" ]; then
              echo "::error::Kunne ikke pushe masters efter 5 forsøg"
              exit 1
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync til OneDrive
        if: steps.c.outputs.changed == 'true'
        env:
          AZURE_TENANT_ID:     ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:     ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: python scripts/sync_to_onedrive.py
